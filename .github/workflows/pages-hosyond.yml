name: Publish Hosyond Chrome Flasher

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'extra_script.py'
      - 'webflasher/**'
      - '.github/workflows/pages-hosyond.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      SQW_VERSION: 2.0.${{ github.run_number }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile both variants (publishing blocked on failure)
        run: pio run -e cyd40 -e cyd40-fast
      - name: Assemble web flasher site
        run: |
          mkdir -p _site/firmware/cyd40 _site/firmware/cyd40-fast
          cp webflasher/index.html _site/index.html
          for env in cyd40 cyd40-fast; do
            dest="_site/firmware/$env"
            cp ".pio/build/$env/firmware.bin" "$dest/firmware.bin"
            cp ".pio/build/$env/bootloader.bin" "$dest/bootloader.bin"
            cp ".pio/build/$env/partitions.bin" "$dest/partitions.bin"
            python - "$dest" "$env" <<'PY'
          import json,sys
          d,env=sys.argv[1:]
          manifest={
            "name":"SquachWatch Hosyond 4.0 ("+env+")",
            "version":__import__("os").environ["SQW_VERSION"],
            "new_install_prompt_erase":False,
            "builds":[{
              "chipFamily":"ESP32",
              "parts":[
                {"path":"bootloader.bin","offset":4096},
                {"path":"partitions.bin","offset":32768},
                {"path":"firmware.bin","offset":65536}
              ]
            }]
          }
          with open(d+"/manifest.json","w") as f:json.dump(manifest,f,indent=2)
          PY
          done
      - name: Prepare fork-owned signed Wi-Fi OTA files
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::warning::OTA_SIGNING_KEY secret is missing; USB web flasher works, but Wi-Fi OTA is not enabled."
            exit 0
          fi
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/cyd40_ota_key.pem"
          openssl ec -in "$RUNNER_TEMP/cyd40_ota_key.pem" -pubout -outform DER 2>/dev/null | tail -c 65 > "$RUNNER_TEMP/cyd40_public_point.bin"
          openssl pkey -in "$RUNNER_TEMP/cyd40_ota_key.pem" -pubout -out "$RUNNER_TEMP/cyd40_ota_pub.pem"
          python - "$RUNNER_TEMP/cyd40_public_point.bin" <<'PY'
          import re, sys
          from pathlib import Path
          public = bytes(int(x, 16) for x in re.findall(r'0x([0-9A-Fa-f]{2})', Path('include/ota_pubkey.h').read_text()))
          actual = Path(sys.argv[1]).read_bytes()
          if len(public) != 65 or actual != public:
              raise SystemExit('OTA_SIGNING_KEY does not match include/ota_pubkey.h; refusing to publish invalid OTA images')
          print('Fork OTA private key matches embedded public key')
          PY
          for env in cyd40 cyd40-fast; do
            cp ".pio/build/$env/firmware.bin" "_site/$env-firmware.bin"
            python tools/sign_firmware.py --key "$RUNNER_TEMP/cyd40_ota_key.pem" --pub "$RUNNER_TEMP/cyd40_ota_pub.pem" --env "$env" --bin "_site/$env-firmware.bin" --out "_site/$env-firmware.sig"
            test -s "_site/$env-firmware.bin"
            test -s "_site/$env-firmware.sig"
            echo "Signed and verified $env OTA firmware for version $SQW_VERSION"
            cp "_site/firmware/$env/manifest.json" "_site/manifest-$env.json"
          done
          rm -f "$RUNNER_TEMP/cyd40_ota_key.pem" "$RUNNER_TEMP/cyd40_ota_pub.pem" "$RUNNER_TEMP/cyd40_public_point.bin"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

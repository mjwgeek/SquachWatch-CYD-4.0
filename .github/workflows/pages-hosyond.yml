name: Publish Hosyond Chrome Flasher

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'extra_script.py'
      - 'webflasher/**'
      - '.github/workflows/pages-hosyond.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      SQW_VERSION: 2.0.${{ github.run_number }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile both variants (publishing blocked on failure)
        run: pio run -e cyd40 -e cyd40-fast
      - name: Checkout LCDWiki board-only firmware source
        uses: actions/checkout@v4
        with:
          ref: feature/lcdwiki-es3c40p
          path: lcdwiki-src
          persist-credentials: false
      - name: Compile LCDWiki ESP32-S3 firmware (publishing blocked on failure)
        run: |
          test -f lcdwiki-src/include/lcdwiki_es3c40p_user_setup.h
          grep -Fq '[env:lcdwiki-es3c40p]' lcdwiki-src/platformio.ini
          pio run -d lcdwiki-src -e lcdwiki-es3c40p
      - name: Assemble web flasher site
        run: |
          mkdir -p _site/firmware/cyd40 _site/firmware/cyd40-fast
          cp webflasher/index.html _site/index.html
          # A USB rescue must explicitly select app0. Without otadata, the
          # bootloader may still select a stale app1 from an earlier OTA.
          # boot_app0.bin resets only OTA-selection metadata at 0xE000; it
          # does not overwrite the NVS settings partition at 0x9000.
          ota="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -s "$ota"
          for env in cyd40 cyd40-fast; do
            dest="_site/firmware/$env"
            cp ".pio/build/$env/firmware.bin" "$dest/firmware.bin"
            cp ".pio/build/$env/bootloader.bin" "$dest/bootloader.bin"
            cp ".pio/build/$env/partitions.bin" "$dest/partitions.bin"
            cp "$ota" "$dest/boot_app0.bin"
            python - "$dest" "$env" <<'PY'
          import json,sys
          d,env=sys.argv[1:]
          manifest={
            "name":"SquachWatch Hosyond 4.0 ("+env+")",
            "version":__import__("os").environ["SQW_VERSION"],
            "new_install_prompt_erase":True,
            "builds":[{
              "chipFamily":"ESP32",
              "parts":[
                {"path":"bootloader.bin","offset":4096},
                {"path":"partitions.bin","offset":32768},
                {"path":"boot_app0.bin","offset":57344},
                {"path":"firmware.bin","offset":65536}
              ]
            }]
          }
          with open(d+"/manifest.json","w") as f:json.dump(manifest,f,indent=2)
          PY
          done
      - name: Validate USB rescue images and preserve-data prompt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for env in ("cyd40", "cyd40-fast"):
              root = Path("_site/firmware") / env
              m = json.loads((root / "manifest.json").read_text())
              assert m["new_install_prompt_erase"] is True, env
              parts = {p["offset"]: p["path"] for p in m["builds"][0]["parts"]}
              assert parts == {
                  4096: "bootloader.bin",
                  32768: "partitions.bin",
                  57344: "boot_app0.bin",
                  65536: "firmware.bin",
              }, (env, parts)
              assert all((root / name).stat().st_size > 0 for name in parts.values())
              print(f"{env}: preserve-data prompt and app0 boot selection verified")
          PY
      - name: Package LCDWiki ESP32-S3 USB test build
        run: |
          dest="_site/firmware/lcdwiki-es3c40p"
          src="lcdwiki-src/.pio/build/lcdwiki-es3c40p"
          mkdir -p "$dest"
          for name in bootloader partitions firmware; do
            test -s "$src/$name.bin"
            cp "$src/$name.bin" "$dest/$name.bin"
          done
          # Reset OTA selection to app0 when installing via USB.
          ota="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -s "$ota"
          cp "$ota" "$dest/boot_app0.bin"
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = Path("_site/firmware/lcdwiki-es3c40p/manifest.json")
          manifest = {
              "name": "SquachWatch LCDWiki ES3C40P 4.0 IPS (EXPERIMENTAL)",
              "version": os.environ["SQW_VERSION"] + "-test",
              "new_install_prompt_erase": True,
              "builds": [{
                  "chipFamily": "ESP32-S3",
                  "parts": [
                      {"path": "bootloader.bin", "offset": 0},
                      {"path": "partitions.bin", "offset": 32768},
                      {"path": "boot_app0.bin", "offset": 57344},
                      {"path": "firmware.bin", "offset": 65536}
                  ]
              }]
          }
          target.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          python -m json.tool "$dest/manifest.json" >/dev/null
      - name: Prepare fork-owned signed Wi-Fi OTA files
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::warning::OTA_SIGNING_KEY secret is missing; USB web flasher works, but Wi-Fi OTA is not enabled."
            exit 0
          fi
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/cyd40_ota_key.pem"
          openssl ec -in "$RUNNER_TEMP/cyd40_ota_key.pem" -pubout -outform DER 2>/dev/null | tail -c 65 > "$RUNNER_TEMP/cyd40_public_point.bin"
          openssl pkey -in "$RUNNER_TEMP/cyd40_ota_key.pem" -pubout -out "$RUNNER_TEMP/cyd40_ota_pub.pem"
          python - "$RUNNER_TEMP/cyd40_public_point.bin" <<'PY'
          import re, sys
          from pathlib import Path
          public = bytes(int(x, 16) for x in re.findall(r'0x([0-9A-Fa-f]{2})', Path('include/ota_pubkey.h').read_text()))
          actual = Path(sys.argv[1]).read_bytes()
          if len(public) != 65 or actual != public:
              raise SystemExit('OTA_SIGNING_KEY does not match include/ota_pubkey.h; refusing to publish invalid OTA images')
          print('Fork OTA private key matches embedded public key')
          PY
          for env in cyd40 cyd40-fast; do
            cp ".pio/build/$env/firmware.bin" "_site/$env-firmware.bin"
            python tools/sign_firmware.py --key "$RUNNER_TEMP/cyd40_ota_key.pem" --pub "$RUNNER_TEMP/cyd40_ota_pub.pem" --env "$env" --bin "_site/$env-firmware.bin" --out "_site/$env-firmware.sig"
            test -s "_site/$env-firmware.bin"
            test -s "_site/$env-firmware.sig"
            echo "Signed and verified $env OTA firmware for version $SQW_VERSION"
            cp "_site/firmware/$env/manifest.json" "_site/manifest-$env.json"
          done
          rm -f "$RUNNER_TEMP/cyd40_ota_key.pem" "$RUNNER_TEMP/cyd40_ota_pub.pem" "$RUNNER_TEMP/cyd40_public_point.bin"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

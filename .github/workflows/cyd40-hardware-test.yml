name: Hosyond CYD40 v1.51.0 - hardware test only
on:
  push:
    branches: ['sync/cyd40-v1.51.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyd40-v151-test
  cancel-in-progress: false
jobs:
  test-port:
    if: github.repository == 'mjwgeek/SquachWatch-CYD-4.0' && github.ref == 'refs/heads/sync/cyd40-v1.51.0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed merge ancestry and preserved hardware
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a3b1442a47c73e0b2041fe6019e5fb363c59e674 HEAD
          git merge-base --is-ancestor 545c8ad7b142d4a0ecdb16f283d6d6332b07514a HEAD
          git diff --exit-code a3b1442a47c73e0b2041fe6019e5fb363c59e674 HEAD -- include/cyd40_user_setup.h include/board_audio.h src/board_audio.cpp include/ota_pubkey.h src/ota_wifi.cpp src/ota_core.cpp partitions_ota.csv webflasher/index.html src/theme.cpp include/caustic_tile.h
          grep -Fq 'getTouchRawZ() < 350' src/main.cpp
          grep -Fq 'BoardAudio::begin()' src/main.cpp
          grep -Fq 'boardBatteryChargingEstimated' src/main.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio
      - name: Compile both real CYD40 profiles
        env:
          SQW_VERSION: 2.0.17
        run: pio run -e cyd40 -e cyd40-fast
      - name: Inspect actual linked flash usage (diagnostics only)
        run: |
          mkdir -p size-audit
          python tools/cyd40_size_audit.py > size-audit/report.txt
          cat size-audit/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cyd40-size-audit
          path: size-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Check exact OTA slot layout and collect USB recovery images
        run: |
          python - <<'PY'
          import struct, shutil
          from pathlib import Path
          expected={'nvs':(0x9000,0x5000),'otadata':(0xe000,0x2000),'app0':(0x10000,0x1e0000),'app1':(0x1f0000,0x1e0000)}
          failures=[]
          for env in ('cyd40','cyd40-fast'):
              root=Path('.pio/build')/env
              data=(root/'partitions.bin').read_bytes()
              parts={}
              for i in range(0,len(data)-31,32):
                  magic,typ,sub,off,size,label,flags=struct.unpack_from('<HBBII16sI',data,i)
                  if magic!=0x50aa: break
                  parts[label.split(b'\0',1)[0].decode()]=(off,size)
              assert all(parts.get(k)==v for k,v in expected.items()), (env,parts)
              size=(root/'firmware.bin').stat().st_size
              print(f'{env}: binary={size:,} bytes, OTA slot={0x1e0000:,} bytes, remaining={0x1e0000-size:,}', flush=True)
              if not 0<size<=0x1e0000:
                  failures.append((env,size,0x1e0000))
                  continue
              dest=Path('candidate')/env
              dest.mkdir(parents=True)
              for name in ('firmware.bin','bootloader.bin','partitions.bin'):
                  shutil.copy2(root/name,dest/name)
              shutil.copy2(Path.home()/'.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin',dest/'boot_app0.bin')
          assert not failures, failures
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyd40-hardware-test-only
          path: candidate/
          if-no-files-found: error
          retention-days: 30
